<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Récap prospection</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f6f3ec; --surface:#fbf9f4; --surface-2:#ece7db; --surface-3:#f1ede4; --hair:#d9d3c6; --hair-2:#cfc8b9;
  --ink:#1e1b16; --ink-2:#5a554b; --muted:#8a8377;
  --accent:#2f5d50; --accent-ink:#244a40; --accent-soft:#dcefe3; --accent-soft-2:#eef4ef;
  --warn:#8a5a00; --warn-soft:#fff1cf; --crit:#8f3f1c; --crit-soft:#f6e3da; --good:#1f5a3a; --good-soft:#dcefe3;
  --bar:#2f5d50; --bar-2:#a8c9bb; --shadow:0 12px 32px -20px rgba(30,27,22,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#16140f; --surface:#1e1b15; --surface-2:#2a261e; --surface-3:#231f18; --hair:#332e25; --hair-2:#453f34;
    --ink:#efeae0; --ink-2:#bdb6a8; --muted:#8a8377;
    --accent:#6fb59f; --accent-ink:#8fcbb7; --accent-soft:#1f3a32; --accent-soft-2:#1b2b26;
    --warn:#e2b45a; --warn-soft:#3a2c0f; --crit:#f0987a; --crit-soft:#3f2318; --good:#7fcb9d; --good-soft:#1f3a2b;
    --bar:#6fb59f; --bar-2:#33544a; --shadow:0 12px 32px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#16140f; --surface:#1e1b15; --surface-2:#2a261e; --surface-3:#231f18; --hair:#332e25; --hair-2:#453f34;
  --ink:#efeae0; --ink-2:#bdb6a8; --muted:#8a8377;
  --accent:#6fb59f; --accent-ink:#8fcbb7; --accent-soft:#1f3a32; --accent-soft-2:#1b2b26;
  --warn:#e2b45a; --warn-soft:#3a2c0f; --crit:#f0987a; --crit-soft:#3f2318; --good:#7fcb9d; --good-soft:#1f3a2b;
  --bar:#6fb59f; --bar-2:#33544a; --shadow:0 12px 32px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
#app{container:app / inline-size;min-height:100vh}
.devtoggle{position:fixed;top:14px;right:14px;z-index:80;box-shadow:var(--shadow)}
@media (max-width:900px){.btn.devtoggle{display:none}}
body.phone{background:var(--surface-2)}
body.phone #app{width:390px;height:844px;min-height:0;margin:28px auto;border:10px solid #1e1b16;border-radius:40px;overflow:auto;transform:translate(0);background:var(--ground);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
body.phone .toast{bottom:88px}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--hair-2);border-radius:6px;padding:9px 12px}
textarea{resize:vertical;min-height:80px}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:500;margin:0;line-height:1.1;text-wrap:balance}
.serif{font-family:"Newsreader",Georgia,serif}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill.neu{background:var(--surface-2);color:var(--ink-2)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.acc{background:var(--accent);color:#fff}
.pill.out{border:1px solid var(--hair-2);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--hair-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px} .btn.danger{color:var(--crit)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;border:1px solid var(--hair-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 14px;font-size:13px;font-weight:500;color:var(--ink-2);min-height:38px} .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap} .chip{border:1px solid var(--hair-2);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%)}
/* login */
.login{min-height:100%;display:flex;align-items:stretch}
.login .side{width:260px;background:var(--accent);color:#eef4ef;display:flex;flex-direction:column;justify-content:space-between;padding:32px 28px}
.login .side .serif{font-size:30px;line-height:1.1;letter-spacing:-.01em}
.login .form{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:40px;max-width:520px}
.field{display:flex;flex-direction:column;gap:6px} .field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input{min-height:44px}
.btn.lg{min-height:44px;font-weight:600}
@container app (max-width:700px){.login{flex-direction:column}.login .side{width:auto;padding:22px 20px;gap:10px}.login .side .serif{font-size:24px}.login .form{padding:26px 20px}}
/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface-3);border-right:1px solid var(--hair);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{padding:4px 12px 18px} .brand .serif{font-size:22px} .brand small{display:block;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--ink-2);font-weight:500;min-height:40px}
.nav a:hover{text-decoration:none;background:var(--surface-2)} .nav a[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 12px 0;border-top:1px solid var(--hair)}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex-shrink:0}
.main{padding:26px 32px 80px;min-width:0}
.tabs{display:none}
@container app (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding:18px 16px 92px}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--hair);padding:4px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;font-size:10.5px;font-weight:600;color:var(--muted);min-height:48px;position:relative}
  .tabs a[aria-current="page"]{color:var(--accent-ink)} .tabs a:hover{text-decoration:none}
  .tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabs .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--crit);color:#fff;font-size:10px;padding:0 5px;border-radius:999px}
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:38px;letter-spacing:-.02em} .head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@container app (max-width:700px){.head h1{font-size:30px}}
/* funnel */
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--hair);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:18px}
.funnel button{display:flex;flex-direction:column;gap:5px;padding:16px 20px;text-align:left;border-right:1px solid var(--hair);min-height:44px}
.funnel button:last-child{border-right:0;background:var(--accent-soft-2)}
.funnel button:hover{background:var(--surface-3)} .funnel button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--accent)}
.funnel .v{font-family:"Newsreader",Georgia,serif;font-size:40px;line-height:1;font-weight:500}
.funnel .v small{font-family:"Instrument Sans",sans-serif;font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.funnel .d{font-size:12.5px;color:var(--ink-2)}
@container app (max-width:700px){.funnel{grid-template-columns:1fr}.funnel button{flex-direction:row;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--hair);padding:12px 16px}.funnel button:last-child{border-bottom:0}.funnel .v{font-size:28px;min-width:64px}.funnel .cap{flex:1}.funnel .d{display:none}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:12px 16px;display:flex;flex-direction:column;gap:2px} .kpi .v{font-family:"Newsreader",Georgia,serif;font-size:28px;line-height:1.1} .kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--crit)} .kpi.alert .cap{color:var(--crit)}
@container app (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* split */
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start} .split.nosel{grid-template-columns:minmax(0,1fr)}
@container app (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
.sect{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px} .sect h2{font-size:22px} .sect .n{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--hair);white-space:nowrap;background:var(--surface-3)}
td{padding:11px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-3)} tr.row.sel td{background:var(--surface-2)}
td .s{display:block;font-size:12px;color:var(--muted)}
.cards{display:none}
@container app (max-width:700px){
  .tbl.calls{display:none} .cards{display:flex;flex-direction:column}
}
/* detail */
.detail{display:flex;flex-direction:column;gap:16px;padding:18px 20px;position:sticky;top:20px}
.detail .title{font-size:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;font-size:13px}
.grid2 .cap{font-size:10.5px;margin-bottom:1px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--hair-2);background:var(--surface);color:var(--ink-2);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;min-height:38px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hist{font-size:12px;color:var(--muted);border-top:1px solid var(--hair);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
@container app (max-width:1100px){
  .detail{position:fixed;inset:auto 0 0 0;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;box-shadow:0 -10px 40px -20px rgba(0,0,0,.5);z-index:50;transform:translateY(105%);transition:transform .25s}
  .detail.open{transform:none;visibility:visible}
  .detail:not(.open){visibility:hidden;pointer-events:none}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45;display:none} .backdrop.open{display:block}
}
/* week chart */
.wk{display:flex;flex-direction:column;gap:8px}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;height:200px;padding:0 4px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;position:relative;min-height:44px}
.bar .stack{width:100%;max-width:64px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.bar .b1{background:var(--bar-2);border-radius:4px 4px 0 0} .bar .b2{background:var(--bar);border-radius:4px 4px 0 0}
.bar:hover .tip{opacity:1}
.tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:12px;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5}
.bar .lbl{font-size:12px;color:var(--ink-2)} .bar.today .lbl{color:var(--accent-ink);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2)} .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.delta{font-size:12px;font-weight:600} .delta.up{color:var(--good)} .delta.down{color:var(--crit)}
/* qualify */
.qcard{padding:22px 24px;display:flex;flex-direction:column;gap:16px;max-width:720px}
.kbd{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--hair-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-2);background:var(--surface-3)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden} .progress i{display:block;height:100%;background:var(--accent)}
/* admin */
.admin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@container app (max-width:900px){.admin{grid-template-columns:minmax(0,1fr)}}
.admin .card{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.admin h2{font-size:20px}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{width:38px;height:22px;border-radius:999px;background:var(--hair-2);position:relative;flex-shrink:0} .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{left:19px}
.led{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--good)} .led.warn{background:var(--warn)} .led.crit{background:var(--crit)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:70;padding:16px} .modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:10px;max-width:720px;width:100%;max-height:85vh;display:flex;flex-direction:column;gap:12px;padding:20px}
.modal pre{font-size:12px;overflow:auto;background:var(--surface-3);padding:12px;border-radius:6px;margin:0;max-height:50vh}
.foot{margin-top:40px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.sr{position:absolute;left:-9999px}

.kboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.kcolh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:8px 12px;border-radius:6px;font-family:"Instrument Sans",sans-serif;font-size:12.5px;font-weight:600}
.kcolh b{font-family:"Newsreader",Georgia,serif;font-size:20px;font-weight:500}
.kcolh.good{background:var(--good-soft);color:var(--good)} .kcolh.acc{background:var(--accent-soft);color:var(--accent-ink)} .kcolh.crit{background:var(--crit-soft);color:var(--crit)} .kcolh.warn{background:var(--warn-soft);color:var(--warn)}
.kc{background:var(--surface);border:1px solid var(--hair);border-radius:8px;display:flex;flex-direction:column;gap:6px;padding:12px 14px 10px}
.kc.sel{background:var(--surface-2);border-color:var(--accent)} .kc.aq{border-style:dashed}
.kcbtn{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.kct{font-weight:600;font-size:14px} .kcs{font-size:12px;color:var(--muted)}
.kcsum{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.kcnx{font-size:12px;color:var(--accent-ink);font-weight:600}
.kcf{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:8px;margin-top:2px}
.kcf .acts{margin-left:auto} .kcf .act{width:28px;height:28px}
.kempty{border:1px dashed var(--hair-2);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px}
.split:not(.nosel) .kboard{grid-template-columns:repeat(3,minmax(0,1fr))}
@container app (max-width:1250px){.kboard{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container app (max-width:900px){.kboard,.split:not(.nosel) .kboard{grid-template-columns:minmax(0,1fr)}.kcsum{-webkit-line-clamp:3}}

.xt td.sumcell{min-width:340px;font-size:13px;color:var(--ink-2)} .xt td.nxcell{min-width:170px;max-width:240px;font-size:12.5px;color:var(--accent-ink);font-weight:600} .xt th{white-space:nowrap}
.xrow .xmain{padding-right:124px} .xacts{position:absolute;right:12px;top:10px}
.period{display:flex;flex-wrap:wrap;gap:0;padding:0;overflow:hidden}
.pblock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;flex:1;min-width:0}
.pblock+.pblock{border-left:1px solid var(--hair)}
.pblock.on{background:var(--surface-3)}
.plabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:6px;min-width:0}
.pblock.on .plabel{color:var(--accent-ink)}
.pblock label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)} .pblock input{min-height:34px;padding:4px 8px}
@container app (max-width:900px){.pblock+.pblock{border-left:0;border-top:1px solid var(--hair)}.pblock{width:100%}.pblock label{flex:1}}

/* état des lieux */
.glance{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;min-width:120px}
.stat .v{font-family:"Newsreader",Georgia,serif;font-size:40px;line-height:1;font-weight:500}
.stat .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.stat .s{font-size:12.5px;color:var(--ink-2)}
.stat.hi .v{color:var(--accent-ink)}
.arrow{color:var(--hair-2);font-size:22px}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px} .sbar i{display:block;min-width:0}
.schips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const userOf=id=>USERS.find(u=>u.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function funnel(calls){const p=calls.filter(c=>c.kind==='prospection');const tent=p.filter(c=>c.dir==='out').length;const eue=p.filter(c=>c.status==='answered').length;const conv=p.filter(c=>c.outcome==='conversation'||c.outcome==='rdv').length;const rdv=p.filter(c=>c.outcome==='rdv').length;return{tent,eue,conv,rdv}};

const ICON={refresh:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>',jour:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>',semaine:'<svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-8M22 19H2"></path></svg>',qualifier:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4l3 2"></path></svg>',equipe:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17.5" cy="9" r="2.5"></circle><path d="M16 14.5c3 .2 5.5 2.3 5.5 5.5"></path></svg>',admin:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>',left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg>',right:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>',check:'<svg viewBox="0 0 24 24" style="stroke-width:3"><path d="M5 12l5 5L20 7"></path></svg>',play:'<svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"></path></svg>'};
CALLS.forEach(c=>{if(c.kind==='inconnu'||(c.kind==='prospection'&&c.outcome==='court'))c.needsReview=true});
const toQualify=()=>CALLS.filter(c=>c.day>=addDays(TODAY,-7)&&c.needsReview&&!c.qualified);

function periodDays(){if(S.mode==='range'){return businessDays(S.from,S.to).filter(d=>d<=TODAY)}return [S.day]}
function dayCalls(){const days=periodDays();return CALLS.filter(c=>days.includes(c.day)&&(S.who==='all'||c.user===S.who))}
const ACT_ICON={rec:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M10 8l6 4-6 4z"></path></svg>',person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>',building:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"></rect><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"></path></svg>'};
function actions(c,big){
  const b=(a,icon,label,dis,title)=>`<button class="act ${big?'btn sm':''}" data-act="${a}" data-id="${c.id}" ${dis?'disabled':''} title="${title}" aria-label="${title}">${icon}${big?label:''}</button>`;
  return `<span class="acts">${b('rec',ACT_ICON.rec,'Enregistrement',c.status!=='answered','Écouter l’enregistrement Ringover')}${b('jcontact',ACT_ICON.person,'Contact',!c.contact||c.kind==='autre','Fiche Jarvi du contact')}${b('jcompany',ACT_ICON.building,'Société',!c.company||c.kind!=='prospection','Fiche Jarvi de la société')}</span>`;
}
function situPill(c){const k=c.situ||(c.needsReview&&!c.qualified?'aq':(c.status==='answered'&&c.dur>=60&&c.kind==='prospection'?'nosum':null));if(!k)return '';const [l,cls]=SITU[k];return `<span class="pill ${cls}">${l}</span>`}

     <div class="row2"><label style="flex:1;font-size:13.5px">Écoute des enregistrements</label><select style="padding:6px 8px"><option>Tous les membres</option><option>Admins seulement</option></select></div>
     <div class="row2"><input id="erase" placeholder="Numéro à effacer (droit RGPD)" style="flex:1;min-width:180px"><button class="btn sm danger" data-act="erase">Effacer</button></div>
     <div style="font-size:12px;color:var(--muted)">Hébergement Supabase Paris (eu-west-3) · chiffrement au repos · journal d'audit conservé</div></section>
  </div>`;
}

/* ---------- Interactions ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(html){const m=document.getElementById('modal');if(!html){m.classList.remove('open');m.innerHTML='';return}m.innerHTML=`<div class="box">${html}</div>`;m.classList.add('open');m.querySelector('[data-act="closeModal"]')?.focus()}
function csv(calls){const h=['jour','heure','sens','collaborateur','entreprise','contact','fonction','issue','situation','duree_s','resume','etape_suivante'];return [h.join(';'),...calls.filter(c=>c.kind!=='autre').map(c=>[c.day,c.t,c.dir,userOf(c.user).name,c.company,c.contact,c.role,c.outcome,c.situ?SITU[c.situ][0]:'',c.dur,(c.summary||'').replace(/[\r\n;]+/g,' '),(c.next||'').replace(/[\r\n;]+/g,' ')].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';'))].join('\n')}
function go(v){S.view=v;S.sel=null;if(location.hash!=='#'+v)history.replaceState(null,'',(S.view==='login'?'#':'#'+v));render();window.scrollTo(0,0)}
function record(c,txt){c.history.push({at:TODAY+' '+new Date().toTimeString().slice(0,5),who:S.me.name,txt})}
function bind(){
  app.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();act(b.dataset.act,b)}));
  app.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.day;if(n===0)S.day=TODAY;else{let d=S.day;do{d=addDays(d,n)}while([0,6].includes(new Date(d+'T12:00:00').getDay()));if(d>TODAY)return;S.day=d}S.sel=null;S.stage=null;render()}));
  app.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.week;S.week=n===0?monday(TODAY):addDays(S.week,7*n);if(S.week>monday(TODAY))S.week=monday(TODAY);render()}));
  app.querySelectorAll('[data-who]').forEach(b=>b.addEventListener('click',()=>{S.who=b.dataset.who;S.sel=null;render()}));
  app.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{S.stage=S.stage===b.dataset.stage?null:b.dataset.stage;S.sel=null;render()}));
  app.querySelectorAll('[data-sel]').forEach(b=>{const f=()=>{S.sel=+b.dataset.sel;render();if(window.innerWidth<=1100)document.querySelector('.detail')?.classList.add('open')};b.addEventListener('click',f);b.addEventListener('keydown',e=>{if(e.key==='Enter')f()})});
  app.querySelectorAll('[data-setday]').forEach(b=>b.addEventListener('click',()=>{S.day=b.dataset.setday;S.mode='day';S.sel=null;S.stage=null;render()}));
  app.querySelectorAll('[data-wk]').forEach(b=>b.addEventListener('click',()=>{let d=addDays(S.day,7*+b.dataset.wk);while(d>TODAY)d=addDays(d,-1);while([0,6].includes(new Date(d+'T12:00:00').getDay()))d=addDays(d,-1);S.day=d;S.sel=null;render()}));
  app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;S.sel=null;S.stage=null;render()}));
  app.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{S.mode='range';const p=b.dataset.preset;if(p==='week'){S.from=monday(TODAY);S.to=TODAY}else if(p==='lastweek'){S.from=addDays(monday(TODAY),-7);S.to=addDays(monday(TODAY),-3)}else{S.from=addDays(TODAY,-29);S.to=TODAY}S.sel=null;render()}));
  app.querySelector('#from')?.addEventListener('change',e=>{S.from=e.target.value;if(S.to<S.from)S.to=S.from;S.mode='range';S.sel=null;render()});
  app.querySelector('#to')?.addEventListener('change',e=>{S.to=e.target.value;if(S.to<S.from)S.from=S.to;S.mode='range';S.sel=null;render()});
  app.querySelectorAll('[data-xview]').forEach(b=>b.addEventListener('click',()=>{S.xview=b.dataset.xview;try{localStorage.setItem('rp_xview',S.xview)}catch(e){}render()}));
  app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{S.open=S.open===+b.dataset.open?null:+b.dataset.open;render()}));
  app.querySelectorAll('[data-sfilter]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();S.sfilter=S.sfilter===b.dataset.sfilter?'':b.dataset.sfilter;S.sel=null;render()}));
  app.querySelector('#whoSel')?.addEventListener('change',e=>{S.who=e.target.value;S.sel=null;render()});
  app.querySelectorAll('[data-qf]').forEach(b=>b.addEventListener('click',()=>{S.qf=b.dataset.qf;render()}));
  app.querySelectorAll('[data-qkind]').forEach(b=>b.addEventListener('click',()=>{const c=CALLS.find(x=>x.id===+b.dataset.id);if(c.kind!==b.dataset.qkind){record(c,'type '+KIND_LABEL[c.kind]+' → '+KIND_LABEL[b.dataset.qkind]);c.kind=b.dataset.qkind}render()}));
  app.querySelectorAll('[data-qout]').forEach(b=>b.addEventListener('click',()=>{const c=CALLS.find(x=>x.id===+b.dataset.id);if(c.outcome!==b.dataset.qout){record(c,'issue '+OUTCOME_LABEL[c.outcome]+' → '+OUTCOME_LABEL[b.dataset.qout]);c.outcome=b.dataset.qout}render()}));
  app.querySelectorAll('[data-qnote]').forEach(i=>i.addEventListener('input',()=>{const c=CALLS.find(x=>x.id===+i.dataset.qnote);c.note=i.value}));
  app.querySelectorAll('[data-goday]').forEach(b=>b.addEventListener('click',()=>{S.day=b.dataset.goday;go('jour')}));
  app.querySelectorAll('[data-team]').forEach(b=>b.addEventListener('click',()=>{S.who=b.dataset.team;go('semaine')}));
  app.querySelectorAll('[data-situ]').forEach(b=>b.addEventListener('click',()=>{const c=current();if(!c)return;if(c.situ!==b.dataset.situ){record(c,'situation → '+SITU[b.dataset.situ][0]);c.situ=b.dataset.situ;if(b.dataset.situ==='rdv')c.outcome='rdv';else if(c.outcome==='rdv')c.outcome='conversation';if(!c.summary)c.summary='';if(!c.next)c.next=NEXT[b.dataset.situ]||''}render()}));
  app.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{const c=current();if(!c)return;if(c.kind!==b.dataset.kind){record(c,'type '+KIND_LABEL[c.kind]+' → '+KIND_LABEL[b.dataset.kind]);c.kind=b.dataset.kind;c.pending=true}render()}));
  app.querySelectorAll('[data-out]').forEach(b=>b.addEventListener('click',()=>{const c=current();if(!c)return;if(c.outcome!==b.dataset.out){record(c,'issue '+OUTCOME_LABEL[c.outcome]+' → '+OUTCOME_LABEL[b.dataset.out]);c.outcome=b.dataset.out;c.pending=true}render()}));
  app.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const u=userOf(b.dataset.toggle);u.active=!u.active;toast(u.active?u.name+' réactivé·e — accès rétabli':u.name+' désactivé·e — accès coupé immédiatement');render()}));
  app.querySelectorAll('[data-role]').forEach(s=>s.addEventListener('change',()=>{const u=userOf(s.dataset.role);u.role=s.value;toast(u.name+' est maintenant '+(s.value==='admin'?'admin (MFA requise)':'membre'))}));
  app.querySelectorAll('[data-line]').forEach(s=>s.addEventListener('change',()=>toast('Ligne réattribuée à '+s.value+' — les prochains appels lui seront comptés')));
  app.querySelector('[data-ret]')?.addEventListener('change',e=>{S.retention=+e.target.value;toast('Conservation des appels : '+S.retention+' mois')});
  app.querySelector('[data-raw]')?.addEventListener('change',e=>{S.rawRetention=+e.target.value;toast('Événements bruts conservés '+S.rawRetention+' jours')});
  app.querySelector('#showAll')?.addEventListener('change',e=>{S.showAll=e.target.checked;render()});
  app.querySelector('#em')?.addEventListener('input',e=>S.email=e.target.value);
  app.querySelectorAll('#mfa input').forEach((i,k,all)=>i.addEventListener('input',()=>{if(i.value&&all[k+1])all[k+1].focus()}));
  app.querySelectorAll('a[href="#logout"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();S.loginStep=0;go('login');toast('Déconnecté')}));
}
function recheck(xs){let found=0;xs.forEach(x=>{x.rechecked=(x.rechecked||0)+1;if(x.id%3===0){const co=pick(COMPANIES);x.company=co[0];x.role=co[1];x.contact=co[2];x.kind='prospection';x.needsReview=x.outcome==='court';if(!x.needsReview)x.qualified=true;record(x,'trouvé dans le CRM Jarvi à la revérification : '+co[2]+' ('+co[0]+')');found++}else{record(x,'revérification Jarvi : numéro toujours absent')}});toast(found?`${found} numéro${found>1?'s':''} trouvé${found>1?'s':''} dans le CRM Jarvi · classé${found>1?'s':''} prospection`:'Aucun numéro trouvé dans Jarvi — toujours inconnu'+(xs.length===1?'':'s'))}
function current(){if(S.view==='qualifier')return toQualify().sort((a,b)=>(b.day+b.t).localeCompare(a.day+a.t))[0];return CALLS.find(x=>x.id===S.sel)}
const INVITED=USERS.map(u=>u.email);
function act(a,b){
  const c=current();
  switch(a){
    case 'magic':{const em=(document.getElementById('em')?.value||'').trim().toLowerCase();S.email=em;if(!em.endsWith('@cabinet-ekinox.fr')){S.loginErr="Cette adresse n'est pas une adresse Ekinox.";render();return}const u=USERS.find(x=>x.email===em);if(!u||!u.active){S.loginErr="Cette adresse n'a pas été invitée. Demandez l'accès à Adrien.";render();return}S.loginErr='';S.me=u;S.loginStep=1;render();break}
    case 'google':{S.loginErr='';S.me=USERS[0];S.loginStep=S.me.role==='admin'?2:0;if(S.loginStep===0){go('jour');toast('Connecté via Google Workspace')}else render();break}
    case 'openlink':{S.loginStep=S.me.role==='admin'?2:0;if(S.loginStep===0){go('jour');toast('Connecté · session valable 12 h')}else render();break}
    case 'mfa':{go('jour');toast('Connecté · MFA vérifiée · session 12 h');break}
    case 'back':{S.loginStep=0;render();break}
    case 'closeDetail':{S.sel=null;render();break}
    case 'toggleRest':{S.showRest=!S.showRest;render();break}
    case 'recheck':{const x=CALLS.find(v=>v.id===+b.dataset.id);if(!x)return;toast('Recherche du numéro dans Jarvi…');setTimeout(()=>{recheck([x]);render()},700);break}
    case 'recheckAll':{const xs=toQualify().filter(v=>v.kind==='inconnu');toast('Recherche de '+xs.length+' numéros dans Jarvi…');setTimeout(()=>{recheck(xs);render()},900);break}
    case 'save':{if(!c)return;const sm=document.getElementById('summary'),nx=document.getElementById('next');if(sm&&sm.value!==(c.summary||'')){c.summary=sm.value;record(c,'résumé modifié')}if(nx&&nx.value!==(c.next||'')){c.next=nx.value;record(c,'étape suivante modifiée')}c.pending=false;toast('Fiche enregistrée · correction tracée');render();break}
    case 'qsave':{const x=CALLS.find(v=>v.id===+b.dataset.id);if(!x)return;x.qualified=true;record(x,'qualifié');S.qDone=(S.qDone||0)+1;toast('Qualifié : '+KIND_LABEL[x.kind]+' · '+OUTCOME_LABEL[x.outcome]);render();break}
    case 'qskip':{const x=CALLS.find(v=>v.id===+b.dataset.id);if(!x)return;x.qualified=true;x.skipped=true;toast('Reporté — reviendra dans la file demain');render();break}
    case 'rec':{const x=CALLS.find(v=>v.id===+b.dataset.id);modal(`<h2 style="font-size:22px">Enregistrement · ${esc(x.company||x.contact||'appel')}</h2><p style="margin:0;color:var(--ink-2)">${esc(dateFR(x.day,true))} à ${x.t} · ${fmtDur(x.dur)} · ${esc(userOf(x.user).name)}. L'audio reste chez Ringover : il s'ouvre dans votre compte Ringover et l'écoute est journalisée.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="closeModal">Annuler</button><button class="btn primary" data-act="closeModal">${ICON.play}Ouvrir dans Ringover</button></div>`);break}
    case 'jcontact':{const x=CALLS.find(v=>v.id===+b.dataset.id);toast('Ouvre la fiche Jarvi de '+(x.contact||'ce contact')+' (nouvel onglet)');break}
    case 'jcompany':{const x=CALLS.find(v=>v.id===+b.dataset.id);toast('Ouvre la fiche Jarvi de la société '+(x.company||'')+' (nouvel onglet)');break}
    case 'listen':{modal(`<h2 style="font-size:22px">Écouter dans Ringover</h2><p style="margin:0;color:var(--ink-2)">L'enregistrement n'est jamais copié dans l'application : il s'ouvre dans Ringover, avec votre propre compte, et l'écoute est journalisée.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="closeModal">Annuler</button><button class="btn primary" data-act="closeModal">Ouvrir Ringover</button></div>`);break}
    case 'jarvi':{toast('Ouvre la fiche dans Jarvi (nouvel onglet)');break}
    case 'export':{const set=S.view==='jour'?dayCalls():CALLS.filter(x=>weekDays(S.week).includes(x.day));const txt=csv(set);modal(`<h2 style="font-size:22px">Export CSV · ${set.length} appels</h2><p style="margin:0;color:var(--ink-2);font-size:13px">Séparateur « ; », encodage UTF-8, numéros masqués. L'export est journalisé (qui, quand, quelle période).</p><pre>${esc(txt)}</pre><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="closeModal">Fermer</button><button class="btn primary" data-act="copy">Copier</button></div>`);document.getElementById('modal')._txt=txt;break}
    case 'copy':{navigator.clipboard?.writeText(document.getElementById('modal')._txt||'').then(()=>toast('CSV copié'),()=>toast('Copie impossible ici'));break}
    case 'closeModal':{modal(null);break}
    case 'invite':{const i=document.getElementById('invite');const em=(i.value||'').trim().toLowerCase();if(!em.endsWith('@cabinet-ekinox.fr')){toast('Seules les adresses @cabinet-ekinox.fr peuvent être invitées');return}if(INVITED.includes(em)){toast('Déjà invité·e');return}const name=cap(em.split('@')[0].split('.')[0]);USERS.push({id:'u'+Date.now(),name,ini:name.slice(0,2).toUpperCase(),email:em,role:'member',active:true,line:'—'});INVITED.push(em);toast('Invitation envoyée à '+em);render();break}
    case 'reconcile':{DAY_STATUS['2026-09-01'].complete=true;DAY_STATUS['2026-09-01'].webhook=DAY_STATUS['2026-09-01'].api;toast('Réconciliation terminée · 4 appels récupérés via l’API Ringover');render();break}
    case 'testwh':{toast('Événement de test reçu · signature valide · 204');break}
    case 'erase':{const v=(document.getElementById('erase').value||'').trim();if(!v){toast('Indiquez un numéro');return}modal(`<h2 style="font-size:22px">Effacer ${esc(v)} ?</h2><p style="margin:0;color:var(--ink-2)">Tous les appels, notes et corrections liés à ce numéro seront supprimés définitivement. L'opération est journalisée.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="closeModal">Annuler</button><button class="btn primary" data-act="closeModal" style="background:var(--crit);border-color:var(--crit)">Effacer définitivement</button></div>`);break}
  }
}
document.getElementById('modal').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b);else if(e.target===e.currentTarget)modal(null)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal(null);if(S.sel){S.sel=null;render()}}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(S.view==='login')return;if(['jour','semaine','qualifier','equipe','admin'].includes(v)&&v!==S.view)go(v)});
render();
</script>
